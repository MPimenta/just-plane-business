<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Works Performance Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=Yellowtail&display=swap">
<style>
/* Layout: a 1950s factory notice board. Sticky punch-clock header, tabbed boards below, time-card style data entry. */
:root{
  --paper:#F1E5CB; --card:#FBF3E1; --ink:#2B221D; --muted:#6F6157; --line:#D8C7A4;
  --teal:#1E5E66; --teal-deep:#163F45; --red:#C23A2A; --mustard:#DFA53A; --on-dark:#F6EBD3;
  --band-done:#1E5E66; --band-floor:#C23A2A; --band-book:#E9D9B4;
  --font-script:"Yellowtail","Brush Script MT",cursive;
  --font-slab:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  --font-body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-card:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F2A2E; --card:#163A3F; --ink:#F1E5CB; --muted:#B5A891; --line:#2E5459;
  --teal:#76B9BE; --teal-deep:#0B2023; --red:#E5634F; --mustard:#EFBD58; --on-dark:#F6EBD3;
  --band-done:#4E9AA0; --band-floor:#D9533F; --band-book:#2A4E52; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F2A2E; --card:#163A3F; --ink:#F1E5CB; --muted:#B5A891; --line:#2E5459;
  --teal:#76B9BE; --teal-deep:#0B2023; --red:#E5634F; --mustard:#EFBD58; --on-dark:#F6EBD3;
  --band-done:#4E9AA0; --band-floor:#D9533F; --band-book:#2A4E52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal-deep)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--font-slab);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.5rem}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header / punch clock */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal-deep);color:var(--on-dark);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:56px;width:auto;display:block}
.brand .sub{font-family:var(--font-script);font-size:1.6rem;line-height:1;color:var(--mustard)}
.brand .co{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.clock{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.roundsel{display:flex;gap:4px;flex-wrap:wrap}
.roundsel button{border:2px solid rgba(246,235,211,.35);background:transparent;color:var(--on-dark);border-radius:999px;min-width:36px;height:36px;font-family:var(--font-slab);cursor:pointer}
.roundsel button[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#2B221D}
.dial{font-family:var(--font-card);font-weight:700;font-size:2.6rem;line-height:1;background:#F6EBD3;color:#2B221D;border-radius:8px;padding:6px 14px;min-width:6.2ch;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dial small{display:block;font-size:.7rem;font-weight:400;letter-spacing:.08em;color:#6F6157}
.btn{border:2px solid currentColor;background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.solid{background:var(--red);border-color:var(--red);color:#FBF3E1}
.top .btn{color:var(--on-dark)}
.top .btn.solid{color:#FBF3E1}

nav.tabs{background:var(--teal);}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:0}
nav.tabs a{color:var(--on-dark);text-decoration:none;padding:10px 14px;font-weight:600;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{border-bottom-color:var(--mustard)}
:root:not([data-theme="light"]) nav.tabs{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs{background:#123236}}
:root[data-theme="dark"] nav.tabs{background:#123236}

main{padding-block:20px 48px;display:grid;gap:20px}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border:2px dashed var(--mustard);border-radius:8px;padding:10px 14px;background:var(--card)}
.roundhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.roundhead .rname{font-family:var(--font-script);font-size:2.3rem;line-height:1;color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--teal);color:var(--on-dark)}
.pill.warm{background:var(--mustard);color:#2B221D}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;vertical-align:bottom;white-space:normal;min-width:6.5em}
tbody td{font-family:var(--font-card);font-size:1.05rem}
tbody td.fname{font-family:var(--font-slab);font-size:1.05rem}
.big{font-family:var(--font-slab);font-size:1.35rem}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--teal);background:transparent;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--on-dark)}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
svg .axis{stroke:var(--line)}
.note{font-size:.85rem;color:var(--muted)}

/* Time card entry */
.timecard{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:0;min-width:0}
.timecard .tc-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink);font-family:var(--font-card);text-transform:uppercase;letter-spacing:.08em}
.timecard table td,.timecard table th{text-align:center}
.timecard input{width:6.2ch;font-family:var(--font-card);font-size:1.05rem;text-align:center;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 2px}
.timecard input.n{width:4ch}
.timecard input.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--paper))}
.iconbtn{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px 6px}
.fields{display:flex;flex-wrap:wrap;gap:14px}
.fields label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.fields input,.fields select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;width:9em}
.fields select{width:auto;max-width:100%}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-family:var(--font-card)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Rounds */
.rounds{display:grid;gap:12px}
.rcard{display:grid;grid-template-columns:4.2rem 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.rcard.current{border:2px solid var(--red)}
.rcard .rn{font-family:var(--font-slab);font-size:2rem;color:var(--teal);text-align:center;line-height:1}
.rcard .rt{font-family:var(--font-script);font-size:1.7rem;color:var(--red);line-height:1.1}
.rcard p{margin:.35rem 0 0;max-width:72ch}
.criteria{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.crit{border-left:4px solid var(--mustard);padding:6px 10px;background:var(--card)}

/* STOP overlay */
.stop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--red) 92%,transparent);color:#FBF3E1;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.stop h1{font-size:clamp(2.4rem,9vw,6rem);line-height:1}
.stop p{font-family:var(--font-script);font-size:2rem;margin:.5rem 0 1rem}
.stop .btn{color:#FBF3E1}
@media (max-width:640px){.dial{font-size:2rem}.brand img{height:44px}.rcard{grid-template-columns:1fr}.rcard .rn{text-align:left}}
@media (prefers-reduced-motion:no-preference){.stop h1{animation:pulse 1s ease-in-out 3}@keyframes pulse{50%{transform:scale(1.05)}}}
</style>
</head>

<script>
(()=>{
"use strict";
const KEY="jpb-dashboard-v1";
const ROUNDS=[
 {n:0,name:"Induction",slogan:"Welcome aboard.",rules:"Practise your fold. Then the solo flight: one plane through all four stations with nothing else going on. Time it from start to finish and enter it as the factory's solo flight time.",scored:false},
 {n:1,name:"Maximum Productivity",slogan:"Nobody should ever be idle.",rules:"The moment your hands are free, start the next one. Put finished work on the next station's pile. No inspection: everything finished counts."},
 {n:2,name:"Continuous Improvement™",slogan:"The solution is obvious: people optimisation.",rules:"Two-minute retrospective first: swap stations, change seats, practise. The production system stays the same: everyone keeps busy, no limits."},
 {n:3,name:"Quality Excellence Initiative",slogan:"Inconveniently, aircraft must be aircraft.",rules:"Before the round the Group Director of Aviation Quality Excellence checks 5 finished planes per factory from Rounds 1 and 2. During the round every plane is inspected against the CEO's Original Prototype™. A rejected plane goes back to the station whose criterion failed."},
 {n:4,name:"Pull",slogan:"An experiment the factory agrees to run.",rules:"Never hand a plane forward: the next station takes one when it is free. At most one plane waits in front of each station. If that place is taken, you stop, even if you are bored. A rejected plane is worked before anything new and counts as the one waiting. No helping other stations."},
 {n:5,name:"Improve the System",slogan:"You understand the production system. Improve it.",rules:"Four minutes of planning: forecast your accepted planes, then agree up to three policies. Same plane, same criteria, same four minutes, four stations, nothing folded before 0:00. Optional: at 2:00 one factory receives the Chairman's personal jet, which jumps every queue."}
];
const CRITERIA=[
 ["Station 1 · Fuselage","Centre crease straight; both corners meet on it."],
 ["Station 2 · Nose","Nose point sharp and symmetric."],
 ["Station 3 · Wings","Wings the same size against the Prototype; wing edges aligned with the bottom of the body."],
 ["Station 4 · Finishing","Body taped closed; wings level; plane number on a wing."]
];
const TABS=[["scoreboard","Scoreboard"],["timekeeper","Time Keeper"],["compare","Compare rounds"],["rounds","Rounds"],["setup","Setup"]];

/* ---------- state ---------- */
function blank(){return{example:false,factories:["Alpha","Bravo","Charlie","Delta"],durations:[240,240,240,240,240,240],orders:40,expediteAt:120,vocab:"auto",round:1,clock:{running:false,startedAt:0,elapsed:0},data:{},entryFactory:0,entryRound:1,selFactory:0,cmpA:1,cmpB:4}}
function cell(s,f,r){const k=f+"|"+r;return s.data[k]||(s.data[k]={planes:[],solo:null,audit:null,forecast:null})}
let S=load();
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);return Object.assign(blank(),o)}}catch(e){}return example()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* example data: seeded generator with a slow Station 3 */
function example(){
  const s=blank();s.example=true;s.round=4;s.entryRound=4;
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const sim=(mode,T,times,pDef,swarm)=>{
    // tiny event sim: stations with queues; push unlimited, pull cap 1
    const n=4,q=[[],[],[],[],[]],busy=[null,null,null,null];let id=0,t=0;const P=[];const cap=mode==="push"?1e9:(mode==="pull"?1:0);
    while(t<T){
      for(let i=n-1;i>=0;i--){
        if(busy[i]){busy[i].rem-=.5;if(busy[i].rem<=0){const lim=i<n-1?cap:1e9;if(q[i+1].length<lim+(mode==="tight"&&i<n-1&&!busy[i+1]?1:0)){q[i+1].push(busy[i].p);busy[i]=null}else busy[i].rem=0}}
        if(!busy[i]){if(q[i].length){const p=q[i].shift();const f=p.rw===i?0.6:1;if(p.rw===i)p.rw=null;busy[i]={p,rem:times[i]*f*(0.6+0.8*rnd())}}else if(i===0){const p={n:++id,s:t,d:null,r:0,rw:null};P.push(p);busy[0]={p,rem:times[0]*(0.6+0.8*rnd())}}}
      }
      while(q[n].length){const p=q[n].shift();if(pDef&&rnd()<pDef&&p.r<2){p.r++;const st=[0,1,2,2,2,3][Math.floor(rnd()*6)];p.rw=st;q[st].unshift(p)}else p.d=t}
      t+=.5;
    }
    return P.map(p=>({n:p.n,s:Math.round(p.s),d:p.d==null?null:Math.round(p.d),r:p.r,x:false}));
  };
  const base=[[7,10,15,9],[8,9,16,9],[6,11,14,10],[7,10,17,8]];
  s.factories.forEach((f,fi)=>{
    const tm=base[fi];
    cell(s,fi,0).solo=Math.round(tm.reduce((a,b)=>a+b,0)+4);
    cell(s,fi,1).planes=sim("push",240,tm,0);
    cell(s,fi,2).planes=sim("push",240,tm.map((x,i)=>i===0?x*.8:x*.95),0);
    cell(s,fi,1).audit=1+(fi%2);cell(s,fi,2).audit=fi%2;
    cell(s,fi,3).planes=sim("push",240,tm.map(x=>x*.95),.22);
    cell(s,fi,4).planes=sim("pull",240,tm.map(x=>x*.95),.18);
  });
  return s;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=sec=>{if(sec==null||!isFinite(sec))return"–";sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
const secs=v=>{if(v==null)return"–";return Math.round(v)+" s"};
function parseT(v){v=String(v||"").trim();if(!v||v==="-")return null;let m=v.match(/^(\d+)[:.,'](\d{1,2})$/);if(m)return(+m[1])*60+(+m[2]);m=v.match(/^(\d+)$/);if(m){const x=+m[1];return x>=100?Math.floor(x/100)*60+x%100:x}return NaN}
const kanban=()=>S.vocab==="on"||(S.vocab==="auto"&&S.round>=4);
const dur=r=>S.durations[r]||240;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- metrics ---------- */
function metrics(fi,r){
  const c=cell(S,fi,r),D=dur(r),solo=cell(S,fi,0).solo;
  const ps=c.planes.filter(p=>p.s!=null&&!isNaN(p.s));
  const done=ps.filter(p=>p.d!=null&&!isNaN(p.d)&&p.d<=D).sort((a,b)=>a.d-b.d);
  const open=ps.filter(p=>!(p.d!=null&&!isNaN(p.d)&&p.d<=D));
  const req=p=>p.x?S.expediteAt:0;
  const cyc=done.map(p=>p.d-p.s);
  let delivered=done.length,auditCut=0;
  if((r===1||r===2)&&c.audit!=null&&delivered){auditCut=Math.round(delivered*Math.min(5,c.audit)/5);}
  // avg WIP over time
  let area=0;for(let t=0;t<D;t+=1){area+=ps.filter(p=>p.s<=t&&!(p.d!=null&&p.d<=t)).length}
  const avgWip=area/D, thr=delivered/D;
  const ex=done.find(p=>p.x);
  const avgCyc=avg(cyc);
  return{started:ps.length,delivered,accepted:delivered-auditCut,auditCut,wip:open.length,
    cycle:avgCyc,last5:avg(cyc.slice(-5)),age:open.length?Math.max(...open.map(p=>D-p.s)):null,
    lead:avg(done.filter(p=>!p.x).map(p=>p.d-req(p))),wait:avg(done.map(p=>p.s-req(p))),
    rejects:ps.reduce((a,p)=>a+(+p.r||0),0),flow:(solo&&avgCyc)?solo/avgCyc*100:null,
    avgWip,little:thr>0?avgWip/thr:null,forecast:c.forecast,expLead:ex?ex.d-S.expediteAt:null,
    done,open,ps,D,hasData:ps.length>0}
}

/* ---------- charts (SVG) ---------- */
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return(m<=2?2:m<=5?5:10)*p}
function cfd(fi,r,W=520,H=240){
  const m=metrics(fi,r),D=m.D,top=Math.max(S.orders,m.started);const L=36,R=20,T=10,B=28,w=W-L-R,h=H-T-B;
  const ymax=niceMax(top);const x=t=>L+t/D*w,y=v=>T+h-v/ymax*h;
  const pts=[];for(let t=0;t<=D;t+=5){const st=m.ps.filter(p=>p.s<=t).length,dn=m.done.filter(p=>p.d<=t).length;pts.push([t,st,dn])}
  const area=(f1,f2)=>"M"+pts.map(p=>x(p[0])+","+y(f1(p))).join("L")+"L"+pts.slice().reverse().map(p=>x(p[0])+","+y(f2(p))).join("L")+"Z";
  let g="";for(let v=0;v<=ymax;v+=ymax/5){g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  for(let t=0;t<=D;t+=60){g+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle">${mmss(t)}</text>`}
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative flow diagram">${g}
  <path d="${area(()=>top,p=>p[1])}" fill="var(--band-book)"/>
  <path d="${area(p=>p[1],p=>p[2])}" fill="var(--band-floor)" fill-opacity=".85"/>
  <path d="${area(p=>p[2],()=>0)}" fill="var(--band-done)"/></svg>`;
}
function scatter(series,W=520,H=240){
  const L=40,R=20,T=10,B=28,w=W-L-R,h=H-T-B;const D=Math.max(...series.map(s=>s.D),60);
  const all=series.flatMap(s=>s.done.map(p=>p.d-p.s));const ymax=niceMax(Math.max(60,...all));
  const x=t=>L+t/D*w,y=v=>T+h-v/ymax*h;let g="";
  for(let v=0;v<=ymax;v+=ymax/5){g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}s</text>`}
  for(let t=0;t<=D;t+=60){g+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle">${mmss(t)}</text>`}
  series.forEach(s=>{s.done.forEach(p=>{g+=`<circle cx="${x(p.d)}" cy="${y(p.d-p.s)}" r="${p.x?6:4}" fill="${s.color}" fill-opacity=".85" stroke="var(--card)" stroke-width="1"/>`})});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cycle time of each finished plane">${g}</svg>`;
}
function bars(r){
  const W=520,rowH=34,H=S.factories.length*rowH+30,L=90,R=40,w=W-L-R;
  const ms=S.factories.map((f,i)=>metrics(i,r));const mx=niceMax(Math.max(10,...ms.map(m=>m.accepted+m.wip)));
  let g="";ms.forEach((m,i)=>{const yy=10+i*rowH,a=m.accepted/mx*w,b=m.wip/mx*w;
    g+=`<text x="${L-8}" y="${yy+17}" text-anchor="end" style="font-size:13px;fill:var(--ink)">${esc(S.factories[i])}</text>
    <rect x="${L}" y="${yy+4}" width="${a}" height="20" fill="var(--band-done)"/><rect x="${L+a}" y="${yy+4}" width="${b}" height="20" fill="var(--band-floor)"/>
    <text x="${L+a+b+6}" y="${yy+18}">${m.accepted} + ${m.wip}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Delivered and unfinished planes per factory">${g}</svg>`;
}

/* ---------- views ---------- */
function labels(){return kanban()?
 {acc:"Throughput",wip:"WIP",cyc:"Cycle time",l5:"Cycle time, last 5",age:"WIP age",lead:"Lead time",rej:"Rejects",flow:"Flow efficiency",little:"Little's Law: avg WIP ÷ throughput"}:
 {acc:"Delivered",wip:"Still on the floor",cyc:"Average build time",l5:"Latest build times",age:"Oldest plane on the floor",lead:"Customer wait",rej:"Sent back"}}
function exampleBanner(){return S.example?`<div class="banner"><span><span class="pill warm">Example data</span> These numbers are invented so you can see the dashboard working.</span><button class="btn" type="button" data-act="clear">Clear and start a session</button></div>`:""}
function roundHead(r){const R=ROUNDS[r];return`<div class="roundhead"><h2>Round ${r}</h2><span class="rname">${esc(R.name)}</span><span class="muted">“${esc(R.slogan)}”</span>${kanban()?'<span class="pill">Kanban words on</span>':''}</div>`}

function vScoreboard(){
  const r=S.round,L=labels(),K=kanban();

  const ms=S.factories.map((f,i)=>metrics(i,r));
  const cols=[["acc",m=>`<span class="big">${m.accepted}</span>${m.auditCut?` <span class="note">(−${m.auditCut} audit)</span>`:""}`],["wip",m=>`<span class="big">${m.wip}</span>`],["cyc",m=>secs(m.cycle)],["l5",m=>secs(m.last5)],["age",m=>secs(m.age)],["lead",m=>secs(m.lead)]];
  if(r>=3)cols.push(["rej",m=>m.rejects]);
  if(K){cols.push(["flow",m=>m.flow==null?"–":Math.round(m.flow)+"%"]);cols.push(["little",m=>m.little==null?"–":`${m.avgWip.toFixed(1)} → ${Math.round(m.little)} s`])}
  let extra="";if(r===5){extra=`<th>Forecast</th><th>Chairman's jet</th>`}
  const rows=S.factories.map((f,i)=>{const m=ms[i];return`<tr><td class="fname">${esc(f)}</td>${m.hasData?cols.map(c=>`<td>${c[1](m)}</td>`).join(""):`<td colspan="${cols.length}" class="note" style="text-align:left">Waiting for the Time Keeper</td>`}${r===5?`<td>${m.forecast??"–"}</td><td>${m.expLead==null?"–":secs(m.expLead)}</td>`:""}</tr>`}).join("");
  let charts=`<div class="panel"><h3>${K?"Throughput and WIP":"Delivered and still on the floor"}</h3><div class="legend" style="margin:.4rem 0"><span><span class="sw" style="background:var(--band-done)"></span>${L.acc}</span><span><span class="sw" style="background:var(--band-floor)"></span>${L.wip}</span></div>${bars(r)}</div>`;

    charts+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>Cumulative flow · ${esc(S.factories[fi])}</h3><div class="chips">${S.factories.map((f,i)=>`<button class="chip" type="button" data-sel="${i}" aria-pressed="${i===fi}">${esc(f)}</button>`).join("")}</div></div>
    <div class="legend" style="margin:.4rem 0"><span><span class="sw" style="background:var(--band-book)"></span>Order book</span><span><span class="sw" style="background:var(--band-floor)"></span>In progress (WIP)</span><span><span class="sw" style="background:var(--band-done)"></span>Done</span></div>${cfd(fi,r)}</div>
    <div class="panel"><h3>Cycle time of each finished plane · ${esc(S.factories[fi])}</h3><p class="note">A rising cloud means each plane takes longer than the last. A flat band is predictable.</p>${scatter([{...metrics(fi,r),color:"var(--red)"}])}</div>`}
  return exampleBanner()+roundHead(r)+`<div class="panel tablewrap"><table><thead><tr><th>Factory</th>${cols.map(c=>`<th>${L[c[0]]}</th>`).join("")}${extra}</tr></thead><tbody>${rows}</tbody></table>
  <p class="note" style="margin:.6rem 0 0">${K?"Cycle time = done − started. Lead time = done − requested (all orders requested at 0:00). WIP age = time since the oldest unfinished plane was started. Flow efficiency = solo flight ÷ cycle time.":"Times in seconds. Planes still on the floor when STOP was called are not finished."}</p></div><div class="grid2">${charts}</div>`;
}

function vTimekeeper(){
  const fi=Math.min(S.entryFactory,S.factories.length-1),r=S.entryRound,c=cell(S,fi,r),D=dur(r);

    <td><input class="num${bd?" bad":""}" id="pd-${i}" data-i="${i}" data-k="d" value="${p.d==null?"":(isNaN(p.d)?esc(p.raw_d||""):mmss(p.d))}" placeholder="${running?"":"m:ss"}" aria-label="Done">${running&&p.d==null?` <button class="btn" type="button" data-stampdone="${i}">Done now</button>`:""}</td>

  <div class="fields"><label>Round<select id="eround">${ROUNDS.map(R=>`<option value="${R.n}" ${R.n===r?"selected":""}>Round ${R.n} · ${esc(R.name)}</option>`).join("")}</select></label>${extra}</div></div>
  ${r===0?"":`<div class="timecard"><div class="tc-head"><span>Time card · ${esc(S.factories[fi])} · Round ${r}</span><span>${c.planes.length} planes · round ${mmss(D)}</span></div>
  <div class="tablewrap"><table><thead><tr><th>Plane #</th><th>Started</th><th>Done</th><th>Rejected</th>${r===5?"<th>Jet ★</th>":""}<th></th></tr></thead><tbody>${c.planes.map(prow).join("")||`<tr><td colspan="6" class="note" style="text-align:center">No planes yet. Add a row, paste your sheet below, or press “Started now” during the round.</td></tr>`}</tbody></table></div>
  <div class="row" style="padding:12px 14px;border-top:2px solid var(--ink)"><button class="btn" type="button" data-act="addrow">Add plane</button>${running?`<button class="btn solid" type="button" data-act="stampstart">Started now (${mmss(elapsed())})</button>`:""}<span class="note">Leave Done empty for planes still on the floor.</span></div></div>
  <div class="panel"><h3>Paste a whole sheet</h3><p class="note">One plane per line: number, started, done, times rejected. Example: <code>7 0:52 2:10 1</code> or <code>8 0:58 -</code></p><textarea id="paste" aria-label="Paste sheet"></textarea><div class="row" style="margin-top:8px"><button class="btn" type="button" data-act="paste">Replace this card with the pasted lines</button></div></div>`}`;
}

/* ---------- clock ---------- */
function elapsed(){const c=S.clock;return Math.min(dur(S.round),c.elapsed+(c.running?(Date.now()-c.startedAt)/1000:0))}
let stopShown=false;
function tick(){const e=elapsed(),D=dur(S.round);$("#dial").innerHTML=`${mmss(Math.floor(e))}<small>of ${mmss(D)}</small>`;
  if(S.clock.running&&e>=D){S.clock.running=false;S.clock.elapsed=D;save();$("#stop").hidden=false;stopShown=true;drawHeader()}
  const sb=$("[data-act=stampstart]");if(sb)sb.textContent=`Started now (${mmss(e)})`;}
setInterval(tick,250);

/* ---------- render ---------- */
let view="scoreboard",confirmClear=false;
function drawHeader(){
  $("#roundsel").innerHTML=ROUNDS.map(R=>`<button type="button" data-round="${R.n}" aria-pressed="${R.n===S.round}" title="Round ${R.n}: ${esc(R.name)}">${R.n}</button>`).join("");
  $("#startBtn").textContent=S.clock.running?"Pause":(S.clock.elapsed>0&&S.clock.elapsed<dur(S.round)?"Resume":"Start");
  $("#tabs").innerHTML=TABS.map(t=>`<a href="#${t[0]}" ${t[0]===view?'aria-current="page"':""}>${t[1]}</a>`).join("");
}
function render(keepFocus){
  const f=document.activeElement&&document.activeElement.id;
  drawHeader();
  const V={scoreboard:vScoreboard,timekeeper:vTimekeeper,compare:vCompare,rounds:vRounds,setup:vSetup}[view]||vScoreboard;
  $("#main").innerHTML=V();tick();
  if(keepFocus&&f){const el=document.getElementById(f);if(el){el.focus();if(el.select&&el.type!=="checkbox")try{el.select()}catch(e){}}}
}
function route(){const h=location.hash.slice(1);view=TABS.some(t=>t[0]===h)?h:"scoreboard";confirmClear=false;render()}
window.addEventListener("hashchange",route);

/* ---------- events ---------- */
function setRound(n){if(S.clock.running)return;S.round=n;S.entryRound=n;S.clock={running:false,startedAt:0,elapsed:0};save();render()}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.round!=null){setRound(+d.round);return}
  if(t.id==="startBtn"){const c=S.clock;if(c.running){c.elapsed=elapsed();c.running=false}else{if(c.elapsed>=dur(S.round))c.elapsed=0;c.startedAt=Date.now();c.running=true;S.entryRound=S.round}save();render();return}
  if(t.id==="resetBtn"){S.clock={running:false,startedAt:0,elapsed:0};save();render();return}
  if(t.id==="stopOk"){$("#stop").hidden=true;location.hash="timekeeper";if(view==="timekeeper")render();return}
  if(d.sel!=null){S.selFactory=+d.sel;save();render();return}
  if(d.ef!=null){S.entryFactory=+d.ef;save();render();return}
  if(d.del!=null){cell(S,S.entryFactory,S.entryRound).planes.splice(+d.del,1);S.example=false;save();render();return}
  if(d.stampdone!=null){const p=cell(S,S.entryFactory,S.entryRound).planes[+d.stampdone];p.d=Math.round(elapsed());S.example=false;save();render();return}
  const c=()=>cell(S,S.entryFactory,S.entryRound);
  switch(d.act){
    case"addrow":{const ps=c().planes;const nx=ps.reduce((m,p)=>Math.max(m,+p.n||0),0)+1;ps.push({n:nx,s:null,d:null,r:0,x:false});S.example=false;save();render();const el=document.getElementById("ps-"+(ps.length-1));el&&el.focus();break}
    case"stampstart":{const ps=c().planes;const nx=ps.reduce((m,p)=>Math.max(m,+p.n||0),0)+1;ps.push({n:nx,s:Math.round(elapsed()),d:null,r:0,x:false});S.example=false;save();render();break}
    case"paste":{const lines=($("#paste").value||"").split(/\n/).map(l=>l.trim()).filter(Boolean);const out=[];
      lines.forEach((l,i)=>{const p=l.split(/[\s;,\t]+/);if(p.length<2)return;const s=parseT(p[1]),dd=parseT(p[2]);out.push({n:+p[0]||i+1,s:isNaN(s)?NaN:s,raw_s:p[1],d:dd==null?null:(isNaN(dd)?NaN:dd),raw_d:p[2],r:+(p[3]||0)||0,x:/[★*x]/i.test(p[4]||"")})});
      c().planes=out;S.example=false;save();render();break}
    case"addfac":S.factories.push("Factory "+(S.factories.length+1));save();render();break;
    case"delfac":S.factories.pop();S.entryFactory=0;S.selFactory=0;save();render();break;
    case"copy":{const txt=JSON.stringify(S);const box=$("#importBox");const done=()=>{$("#msg").textContent="Session data copied."};
      try{navigator.clipboard.writeText(txt).then(done,()=>{box.value=txt;box.select();$("#msg").textContent="Copy the selected text with Ctrl+C."})}catch(err){box.value=txt;box.select();$("#msg").textContent="Copy the selected text with Ctrl+C."}break}
    case"import":{try{const o=JSON.parse($("#importBox").value);if(!o||!Array.isArray(o.factories))throw 0;S=Object.assign(blank(),o);save();render();$("#msg").textContent="Session loaded."}catch(err){$("#msg").textContent="That text isn't session data. Paste exactly what “Copy session data” produced."}break}
    case"loadex":S=example();save();render();break;
    case"clear":confirmClear=true;if(view!=="setup"){location.hash="setup";}render();break;
    case"clearno":confirmClear=false;render();break;
    case"clearyes":{const keep={factories:S.factories,durations:S.durations,orders:S.orders,expediteAt:S.expediteAt,vocab:S.vocab};S=Object.assign(blank(),keep,{round:0,entryRound:0});confirmClear=false;save();render();break}
  }
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.i!=null){const p=cell(S,S.entryFactory,S.entryRound).planes[+d.i];if(!p)return;
    if(d.k==="x")p.x=t.checked;else if(d.k==="n")p.n=t.value.trim();else if(d.k==="r")p.r=Math.max(0,parseInt(t.value)||0);
    else{const v=parseT(t.value);p[d.k]=v;p["raw_"+d.k]=t.value}
    S.example=false;save();render(true);return}
  if(t.id==="eround"){S.entryRound=+t.value;save();render();return}
  if(t.id==="solo"){const v=parseT(t.value);cell(S,S.entryFactory,0).solo=isNaN(v)?null:v;S.example=false;save();render(true);return}
  if(t.id==="audit"){cell(S,S.entryFactory,S.entryRound).audit=t.value===""?null:Math.max(0,Math.min(5,+t.value));save();render(true);return}
  if(t.id==="forecast"){cell(S,S.entryFactory,5).forecast=t.value===""?null:+t.value;save();render(true);return}
  if(t.id==="cmpA"){S.cmpA=+t.value;save();render();return}
  if(t.id==="cmpB"){S.cmpB=+t.value;save();render();return}
  if(d.fac!=null){S.factories[+d.fac]=t.value.trim()||("Factory "+(+d.fac+1));save();drawHeader();return}
  if(d.dur!=null){const v=parseT(t.value);if(v&&!isNaN(v))S.durations[+d.dur]=v;save();render();return}
  if(t.id==="orders"){S.orders=Math.max(10,+t.value||40);save();return}
  if(t.id==="expAt"){const v=parseT(t.value);if(v!=null&&!isNaN(v))S.expediteAt=v;save();return}
  if(t.id==="vocab"){S.vocab=t.value;save();render();return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".timecard input")){e.preventDefault();const t=e.target;t.dispatchEvent(new Event("change",{bubbles:true}));
    const i=+t.dataset.i,k=t.dataset.k,order=["n","s","d","r"];const ps=cell(S,S.entryFactory,S.entryRound).planes;
    if(k==="r"||k==="d"){if(i===ps.length-1&&k==="r"){const nx=ps.reduce((m,p)=>Math.max(m,+p.n||0),0)+1;ps.push({n:nx,s:null,d:null,r:0,x:false});save();render()}const el=document.getElementById("ps-"+(i+1));el&&el.focus()}
    else{const el=document.getElementById({n:"ps",s:"pd"}[k]+"-"+i);el&&el.focus()}}
});
if(S.clock.running&&elapsed()>=dur(S.round)){S.clock.running=false;S.clock.elapsed=dur(S.round)}
route();
})();
</script>

</body>
</html>
